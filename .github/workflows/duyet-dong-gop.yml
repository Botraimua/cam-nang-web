name: Duyet dong gop

# Duyệt bài đóng góp. Ba cách đều được:
#   1. Trả lời email thông báo với nội dung /duyet  (không cần mở GitHub)
#   2. Bình luận /duyet ngay trong phiếu trên GitHub
#   3. Gắn nhãn "duyet" cho phiếu
# Từ chối: trả lời /tuchoi (hoặc bấm Close issue)
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  dang-bai:
    if: >
      github.event.issue.state == 'open' &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'duyet') ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
         (contains(github.event.comment.body, '/duyet') ||
          contains(github.event.comment.body, '/duyệt')))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tao bai tu phieu
        id: tao
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/publish-contribution.mjs

      - name: Bao loi neu khong tao duoc
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reason = 'Không rõ lý do — xem chi tiết trong tab Actions.';
            try { reason = fs.readFileSync('publish-error.txt', 'utf8'); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Chưa đăng được bài.**\n\n${reason}\n\nSửa lại nội dung phiếu rồi trả lời \`/duyet\` lần nữa nhé.`
            });

      - name: Kiem tra build truoc khi dang
        run: |
          npm ci
          npm run build

      - name: Luu bai vao repo
        id: luu
        run: |
          SLUG=$(cat published-slug.txt)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          rm -f published-slug.txt publish-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parts/community.json
          git commit -m "Dang bai dong gop #${{ github.event.issue.number }}: $SLUG"
          git push

      - name: Bao da dang xong
        uses: actions/github-script@v7
        with:
          script: |
            const slug = '${{ steps.luu.outputs.slug }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Đã đăng bài!**\n\nBài sẽ lên web sau khoảng 1 phút:\nhttps://cam-nang-web.vercel.app/cam-nang/${slug}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  tu-choi:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/tuchoi') ||
       contains(github.event.comment.body, '/khongduyet'))
    runs-on: ubuntu-latest
    steps:
      - name: Dong phieu
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🗑️ **Đã bỏ qua bài này** — không đăng lên web.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
